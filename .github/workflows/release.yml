name: Release

# Changesets through inzumer-ci (@v2: Changesets CLI v3): "Version Packages" PR, then npm publish with provenance.
on:
  push:
    branches: [main]
  # Run it by hand when a push could not start it (e.g. a missing inzumer-ci tag).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    uses: inzumer/inzumer-ci/.github/workflows/changesets-release.yml@v2
    with:
      check: pnpm check
      publish: pnpm release
    secrets: inherit
